name: build-release

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --release -i python3.9 -i python3.10 -i python3.11 -i python3.12
            manylinux: auto
          - os: windows-latest
            args: --release
            manylinux: auto
          - os: macos-latest
            args: --release
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: PyO3/maturin-action@v1
      with:
        command: build
        args: ${{ matrix.args }}
        manylinux: ${{ matrix.manylinux }}
    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: target/wheels/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: PyO3/maturin-action@v1
      with:
        command: sdist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: target/wheels/*.tar.gz

  publish-pypi:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
    - uses: actions/download-artifact@v4
      with:
        pattern: sdist
        merge-multiple: true
    - run: |
        mkdir dist
        find . -name '*.whl' -exec cp {} dist/ \;
        find . -name '*.tar.gz' -exec cp {} dist/ \;
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
